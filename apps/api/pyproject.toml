[project]
name = "convertit-api"
version = "0.1.0"
description = "ConvertIt Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=25.1.0",
    "psutil>=6.1.1",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
    "redis>=5.0.0",
    # [default] pulls in yt-dlp-ejs (YouTube challenge solver scripts used with Deno)
    "yt-dlp[default]>=2026.10.26",
    "pdf2docx>=0.5.8",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.0",
    "openai>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "fakeredis>=2.27.0",
    "ruff>=0.9.6",
    "mypy>=1.15.0",
    "types-psutil>=6.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["E501"] # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["filetype.*", "yt_dlp.*", "pdf2docx.*", "pdfplumber.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
