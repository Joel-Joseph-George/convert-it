name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Vitest tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Security audit (non-blocking)
        run: npm audit || true

  api:
    name: Backend (API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
          pip install pip-audit

      - name: Ruff Lint & Format Check
        run: |
          cd apps/api
          ruff check app tests
          ruff format --check app tests

      - name: Mypy Type Check
        run: |
          cd apps/api
          mypy app tests

      - name: Pytest
        run: |
          cd apps/api
          pytest

      - name: Docker Build Check
        run: |
          docker build -t convertit-api:ci -f apps/api/Dockerfile apps/api

      - name: Security audit (non-blocking)
        run: pip-audit || true
