name: Bump yt-dlp

# YouTube changes often break yt-dlp. The version is pinned in apps/api/pyproject.toml,
# so this opens a PR each week a new release is out; merging it rebuilds the API image.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump pin to latest release
        id: bump
        run: |
          bash scripts/bump_ytdlp.sh
          echo "version=$(sed -nE 's/.*"yt-dlp\[default\]==([^"]+)".*/\1/p' apps/api/pyproject.toml)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/bump-yt-dlp
          commit-message: 'chore(api): bump yt-dlp to ${{ steps.bump.outputs.version }}'
          title: 'chore(api): bump yt-dlp to ${{ steps.bump.outputs.version }}'
          body: |
            Automated weekly bump of the pinned yt-dlp version. CI runs the API tests;
            merging redeploys the API with the new release.
          delete-branch: true
